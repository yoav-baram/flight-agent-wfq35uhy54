# Runs the vacation flight monitor on GitHub's servers, so it keeps working
# when your laptop is off.
#
# ONE-TIME SETUP: add your ntfy topic as a repository secret.
#   Repo -> Settings -> Secrets and variables -> Actions -> New repository secret
#   Name: NTFY_TOPIC     Value: your ntfy topic name
# (This repo is public - never put the topic in a file. Secrets are hidden
# from logs.)
#
# To run it right now instead of waiting for the schedule:
#   Actions tab -> "Flight monitor" -> Run workflow.
#
# The "last digest sent" record lives on the separate `state` branch, because
# a runner starts with an empty disk every time. Without it every run would
# think it was the first and notify you again.

name: Flight monitor

on:
  schedule:
    # Every 2 hours, at :17 (avoids the busy top-of-the-hour). UTC.
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write # needed to save state to the `state` branch

# Never let two runs overlap: they would both read the same saved state.
concurrency:
  group: flight-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Check out the saved state
        uses: actions/checkout@v4
        with:
          ref: state
          path: state-branch

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci

      - name: Run one check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          STATE_DIR: state-branch
        run: npx tsx src/vacationMonitor.ts --once

      - name: Save state
        if: always()
        working-directory: state-branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "State unchanged."
          else
            git commit -m "Update digest state"
            git push
          fi
